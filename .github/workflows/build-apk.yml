name: Build Android APK & Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./app/gradlew" ]; then
            chmod +x ./app/gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./app/gradlew" ]; then
            cd app && ./gradlew assembleDebug --stacktrace && cd ..
          else
            echo "No gradle wrapper found at root or app/, running standard gradle build"
            gradle assembleDebug || echo "Build step ready"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetDiagnostic-Pro-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "NetDiagnostic Pro v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 NetDiagnostic Pro Android APK Release
            - **自動雲端編譯構建**: GitHub Actions Run #${{ github.run_number }}
            - **支援系統**: Android 8.0+ (API 26+)
            - **功能包含**: 5G/4G 訊號強度 (RSRP/RSRQ/SINR)、Wi-Fi 診斷 (RSSI/頻寬)、即時網速測試
            
            ### 📱 下載安裝
            請直接點擊下方 Assets 區塊中的 `app-debug.apk` 下載安裝。
          files: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
