name: Build Android APK & Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Scaffold, Properties and Native Engine
        run: |
          mkdir -p app/src/main/java/com/netdiagnostic/pro
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # 1. 啟用 AndroidX 與 JVM 記憶體最佳化
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          # 2. 建立 settings.gradle.kts
          python3 -c '
          with open("settings.gradle.kts", "w") as f:
              f.write("""pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SignalApp"
          include(":app")
          """)
          '

          # 3. 建立 build.gradle.kts
          python3 -c '
          with open("build.gradle.kts", "w") as f:
              f.write("""plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          """)
          '

          # 4. 建立 app/build.gradle.kts
          python3 -c '
          with open("app/build.gradle.kts", "w") as f:
              f.write("""plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.netdiagnostic.pro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.netdiagnostic.pro"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.activity:activity-ktx:1.8.2")
          }
          """)
          '

          # 5. 複製愛動咖Signal 診斷網頁引擎至 Android 內建 Assets
          if [ -f "docs/index.html" ]; then
            cp docs/index.html app/src/main/assets/index.html
          fi

          # 6. 建立 AndroidManifest.xml (設定應用名稱為 愛動咖Signal)
          python3 -c '
          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="愛動咖Signal" android:supportsRtl="true" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)
          '

          # 7. 建立完整 WebView MainActivity.kt (解決空白畫面)
          python3 -c '
          with open("app/src/main/java/com/netdiagnostic/pro/MainActivity.kt", "w") as f:
              f.write("""package com.netdiagnostic.pro

          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  webView = WebView(this)
                  setContentView(webView)

                  val settings: WebSettings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.allowFileAccess = true
                  settings.allowContentAccess = true
                  settings.loadWithOverviewMode = true
                  settings.useWideViewPort = true
                  settings.cacheMode = WebSettings.LOAD_DEFAULT

                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()

                  webView.loadUrl("file:///android_asset/index.html")

                  val permissions = arrayOf(
                      android.Manifest.permission.INTERNET,
                      android.Manifest.permission.ACCESS_NETWORK_STATE,
                      android.Manifest.permission.ACCESS_WIFI_STATE,
                      android.Manifest.permission.ACCESS_FINE_LOCATION
                  )
                  val needed = permissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (needed.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toTypedArray(), 101)
                  }
              }

              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          """)
          '

          # 8. 準備 Gradle Wrapper
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.4 || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 愛動咖Signal-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "愛動咖Signal v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 愛動咖Signal Android APK Release
            - **自動雲端編譯構建**: GitHub Actions Run #${{ github.run_number }}
            - **支援系統**: Android 8.0+ (API 26+)
            - **功能包含**: 5G/4G 訊號強度 (RSRP/RSRQ/SINR)、Wi-Fi 診斷 (RSSI/頻寬)、即時網速測試
            
            ### 📱 下載安裝
            請直接點擊下方 Assets 區塊中的 `app-debug.apk` 下載安裝。
          files: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
